# Quick checks on every PR and push to main: the repo checks and unit tests, the Firestore adapter against the local
# emulator (demo project, nothing reaches a real Firebase project), the update module in a browser, the Vite builds,
# and app-starter's browser tests on this engine (consumer.yml, 2 shards; blocks). Jobs side by side.
# The report-only consumer rows (the other apps on this engine) are in full-checks.yml ("Full checks": nightly with
# the soak, and by hand with a PR number or ref). Repo variable FULL_CHECKS_ON_PRS=true (Settings, Secrets and
# variables, Actions, Variables) makes PRs run them too.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'update-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1.11.0
        with:
          install: 'false'
      - name: Types (JSDoc, tsc --checkJs)
        run: npm install --no-save --no-package-lock typescript@5.8.3 && npx tsc -p .   # same as package.json
      - name: Types are up to date (types/, generated from the JSDoc)
        run: |
          npx tsc -p tsconfig.types.json && git add -N types && git diff --exit-code --stat -- types || { echo "types/ is stale: run npm run types and commit it"; exit 1; }
      - name: Types through the import-map names (@core/* via paths)
        run: npx tsc -p test/types
      - name: Modularity rules (side-effect-free entries, no cross-entry imports, literal URLs, .js)
        run: node tools/modularity.mjs
      - name: Generated parts are current (version, file lists, src/ exports; from package.json + the import graph)
        run: node tools/generate.mjs --check
      - name: Repo check (with the Worker tests)
        run: node tools/check.mjs
      - name: Unit tests
        run: node --test test/*.test.mjs update/test/*.test.mjs
      - name: Proof-read (pages and documents)
        run: node tools/proofread.mjs

  vite:
    # Vite is a dev dependency only: nothing shipped needs it. (a) core external by URL, (b) core bundled from source
    # with the unused update module shaken out, (c) the same from the package installed from this commit's git ref.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A PR that changes only .md files skips this job's steps (the job still runs and reports success, so a required
      # check cannot hang). Compares the event's base and head commits (a re-run judges the same commits); renames count by both names. Pushes, tags and manual runs always run everything; any doubt
      # (API error, 3000+ files) runs everything. The unit job (proof-read, repo checks) always runs.
      - name: Only .md files changed?
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[] | .filename, (.previous_filename // empty)')" && [ -n "$files" ]; then
            n="$(printf '%s\n' "$files" | wc -l)"
            if [ "$n" -lt 3000 ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then docs=true; fi
          fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs"
      - uses: actions/checkout@v4
        if: steps.docs.outputs.docs != 'true'
      - uses: flamingbeing/app-devkit/setup-node@v1.11.0
        if: steps.docs.outputs.docs != 'true'
        with:
          install: 'false'
      - name: Vite (dev dependency, not saved)
        if: steps.docs.outputs.docs != 'true'
        run: npm install --no-save --no-package-lock vite@6.3.5
      - name: (a) core external by URL
        if: steps.docs.outputs.docs != 'true'
        run: node test/vite/build.mjs external
      - name: (b) core aliased to source, update shaken out
        if: steps.docs.outputs.docs != 'true'
        run: node test/vite/build.mjs source
      - name: (c) installed from the git ref (package exports)
        if: steps.docs.outputs.docs != 'true'
        env:
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          dir="$RUNNER_TEMP/vite-package" && mkdir -p "$dir" && cp test/vite/index.html test/vite/main.js test/vite/build.mjs "$dir/"
          cd "$dir" && echo '{ "private": true, "type": "module" }' > package.json
          npm install --no-package-lock vite@6.3.5 "app-sync@github:flamingbeing/app-sync#$REF"
          node build.mjs package

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A PR that changes only .md files skips this job's steps (the job still runs and reports success, so a required
      # check cannot hang). Compares the event's base and head commits (a re-run judges the same commits); renames count by both names. Pushes, tags and manual runs always run everything; any doubt
      # (API error, 3000+ files) runs everything. The unit job (proof-read, repo checks) always runs.
      - name: Only .md files changed?
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[] | .filename, (.previous_filename // empty)')" && [ -n "$files" ]; then
            n="$(printf '%s\n' "$files" | wc -l)"
            if [ "$n" -lt 3000 ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then docs=true; fi
          fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs"
      - uses: actions/checkout@v4
        if: steps.docs.outputs.docs != 'true'
      - uses: flamingbeing/app-devkit/setup-node@v1.11.0
        if: steps.docs.outputs.docs != 'true'
      - uses: flamingbeing/app-devkit/setup-emulators@v1.11.0
        if: steps.docs.outputs.docs != 'true'
        with:
          firebase-tools-version: '13.35.1'   # same as package.json
          devkit-dir: ''
      - name: Firestore adapter (local emulator)
        if: steps.docs.outputs.docs != 'true'
        run: npm run test:emulator

  update-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A PR that changes only .md files skips this job's steps (the job still runs and reports success, so a required
      # check cannot hang). Compares the event's base and head commits (a re-run judges the same commits); renames count by both names. Pushes, tags and manual runs always run everything; any doubt
      # (API error, 3000+ files) runs everything. The unit job (proof-read, repo checks) always runs.
      - name: Only .md files changed?
        id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          docs=false
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD" --jq '.files[] | .filename, (.previous_filename // empty)')" && [ -n "$files" ]; then
            n="$(printf '%s\n' "$files" | wc -l)"
            if [ "$n" -lt 3000 ] && ! printf '%s\n' "$files" | grep -qv '\.md$'; then docs=true; fi
          fi
          echo "docs=$docs" >> "$GITHUB_OUTPUT"
          echo "docs-only: $docs"
      - uses: actions/checkout@v4
        if: steps.docs.outputs.docs != 'true'
      - uses: flamingbeing/app-devkit/setup-node@v1.11.0
        if: steps.docs.outputs.docs != 'true'
        with:
          install: 'false'
      - name: Playwright with Chromium (not saved in package.json)
        if: steps.docs.outputs.docs != 'true'
        run: npm install --no-save --no-package-lock playwright@1.63.0 && npx playwright install chromium
      - name: Update module in a real browser
        if: steps.docs.outputs.docs != 'true'
        run: node update/test/e2e.mjs

  # app-starter (the reference app) on this engine, split so no shard runs much over a minute; it blocks
  consumer:
    uses: ./.github/workflows/consumer.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      rows: >-
        [{"row": "app-starter 1 of 2", "key": "app-starter-1", "repo": "app-starter", "blocking": true, "pw": "project",
          "emulators": "firestore,auth", "cmd": "npx playwright test --shard=1/2"},
         {"row": "app-starter 2 of 2", "key": "app-starter-2", "repo": "app-starter", "blocking": true, "pw": "project",
          "emulators": "firestore,auth", "cmd": "npx playwright test --shard=2/2", "mixed": true}]

  full:
    # the repo variable FULL_CHECKS_ON_PRS=true runs Full checks on PRs as well
    if: github.event_name == 'pull_request' && vars.FULL_CHECKS_ON_PRS == 'true'
    uses: ./.github/workflows/full-checks.yml
    permissions:
      contents: read
      pull-requests: read
