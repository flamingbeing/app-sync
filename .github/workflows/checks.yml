# Every PR and push to main: the repo checks and unit tests, and the Firestore adapter against the local emulator
# (demo project, nothing reaches a real Firebase project). Two jobs side by side.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'update-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
        with:
          install: 'false'
      - name: Repo check (with the Worker tests)
        run: node tools/check.mjs
      - name: Unit tests
        run: node --test test/*.test.mjs update/test/*.test.mjs
      - name: Proof-read (pages and documents)
        run: node tools/proofread.mjs

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
      - uses: flamingbeing/app-devkit/setup-emulators@v1
        with:
          firebase-tools-version: '13.35.1'   # same as package.json
          devkit-dir: ''
      - name: Firestore adapter (local emulator)
        run: npm run test:emulator

  update-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
        with:
          install: 'false'
      - name: Playwright with Chromium (not saved in package.json)
        run: npm install --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Update module in a real browser
        run: node update/test/e2e.mjs
