# Deploys this repo's Worker on every push to main (and to beta, as the Worker's "beta" environment, if
# wrangler.jsonc has one). The deploy first builds dist/ from every release tag (tools/build-sync.mjs), which fails if
# a released version no longer matches versions.lock.json.
# Needs repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; without them the run says so and skips.
name: Deploy

on:
  push:
    branches: [main, beta]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets present?
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::No Cloudflare secrets in this repo yet (gh-admin deploy-secrets); skipping the deploy."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          fetch-depth: 0   # all tags: each release is rebuilt from its tag
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'true'
        with:
          node-version: 22
      - name: Build the versions (dist/sync/<x.y.z>/)
        if: steps.gate.outputs.go == 'true'
        run: git fetch --tags --force --quiet && node tools/build-sync.mjs
      - name: Deploy
        if: steps.gate.outputs.go == 'true'
        run: |
          if [ "$GITHUB_REF_NAME" = beta ]; then npx --yes wrangler@4 deploy --env beta
          else npx --yes wrangler@4 deploy; fi
