# Nightly soak (app-devkit README, "soak.yml"): the unit tests 50 times and a fresh range of 10k model seeds, no retries,
# at 02:30 SGT. A failure opens or updates ONE issue titled "Nightly soak"; it closes after 7 clean nights. Not a
# required check, never blocks a PR. Also runs by hand (Actions, "Nightly soak", Run workflow).
name: Nightly soak
on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  soak:
    uses: flamingbeing/app-devkit/.github/workflows/soak.yml@v1.13.5
    with:
      repeat: 0
      slow-repeat: 0
      unit-command: bash tools/soak-unit.sh
      unit-repeat: 50
      model-command: bash tools/soak-model.sh
